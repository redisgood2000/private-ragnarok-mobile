services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: privateragnarok
      POSTGRES_USER: game
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "5432:5432"
    volumes:
      - game_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game -d privateragnarok"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: .
      dockerfile: src/PrivateRagnarok.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__GameDb: Host=db;Port=5432;Database=privateragnarok;Username=game;Password=local_dev_only
      Auth__JwtKey: ${Auth__JwtKey:?Set Auth__JwtKey in .env}
      Auth__Issuer: PrivateRagnarok
      Auth__Audience: PrivateRagnarokClient
      Game__InviteCode: ${Game__InviteCode:?Set Game__InviteCode in .env}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  game_db:
