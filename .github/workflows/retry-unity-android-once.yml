name: Diagnose and Retry Unity Android APK Once

on:
  workflow_run:
    workflows: ["Unity Android APK"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  diagnose-and-retry:
    name: Fetch failure logs and retry once
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1 }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch failed workflow logs
        id: logs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set +e
          gh run view "$RUN_ID" --repo "$REPOSITORY" --log > failure.log 2>&1
          LOG_EXIT=$?
          {
            echo "## Unity Android APK failure diagnosis"
            echo
            echo "- Failed run: [$RUN_ID](https://github.com/$REPOSITORY/actions/runs/$RUN_ID)"
            echo "- Log fetch exit code: $LOG_EXIT"
            echo
            echo "### Error candidates"
            grep -Ein -m 80 'error CS[0-9]+|error:|Exception:|ArgumentException:|NullReferenceException:|Build failed|FAILURE:|BUILD FAILED|##\[error\]' failure.log | tail -n 80 || true
          } >> "$GITHUB_STEP_SUMMARY"
          if [ ! -s failure.log ]; then
            echo "No log content was returned by gh run view." > failure.log
          fi

      - name: Upload failure logs for inspection
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Android-Failure-Logs-${{ github.event.workflow_run.run_number }}
          path: failure.log
          retention-days: 14
          if-no-files-found: error

      - name: Re-run the failed workflow once
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          gh run rerun "$RUN_ID" --repo "$REPOSITORY" --failed
          echo "GitHub accepted one automatic retry of failed jobs."
