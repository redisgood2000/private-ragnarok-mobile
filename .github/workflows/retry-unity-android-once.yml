name: Retry Unity Android APK Once

on:
  workflow_run:
    workflows: ["Unity Android APK"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  retry-once:
    name: Retry failed Android build once
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1 }}
    runs-on: ubuntu-latest
    steps:
      - name: Re-run the failed workflow
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.payload.workflow_run.id;
            const attempt = context.payload.workflow_run.run_attempt;

            core.info(`Workflow run ${runId} failed on attempt ${attempt}.`);
            core.info("Starting one automatic retry.");

            await github.rest.actions.reRunWorkflow({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId
            });

            core.info("GitHub accepted the automatic retry request.");
