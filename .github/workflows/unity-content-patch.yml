name: Unity Android Content Patch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "client/Unity/Assets/RemoteContent/**"

permissions:
  contents: write

concurrency:
  group: unity-content-patch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish-patch:
    name: Build and publish remote Android content
    runs-on: ubuntu-latest
    steps:
      - name: Check Unity license secret
        shell: bash
        env:
          UNITY_LICENSE_SECRET: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -z "$UNITY_LICENSE_SECRET" ]; then
            echo "::error::Add the UNITY_LICENSE repository secret before building a content patch."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET for NuGet restore
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore Unity NuGet dependencies
        run: |
          dotnet tool install --global NuGetForUnity.Cli --version 4.5.0
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          export PATH="$PATH:$HOME/.dotnet/tools"
          nugetforunity restore client/Unity

      - name: Verify restored Unity assemblies
        shell: bash
        run: |
          set -euo pipefail
          test -d client/Unity/Assets/Packages
          for assembly in Microsoft.AspNetCore.Connections.Abstractions Microsoft.Bcl.TimeProvider Microsoft.Bcl.AsyncInterfaces Microsoft.Extensions.Features Microsoft.Extensions.DependencyInjection Microsoft.Extensions.DependencyInjection.Abstractions Microsoft.Extensions.Logging Microsoft.Extensions.Logging.Abstractions Microsoft.Extensions.Options Microsoft.Extensions.Primitives System.Buffers System.Diagnostics.DiagnosticSource System.IO.Pipelines System.Memory System.Runtime.CompilerServices.Unsafe System.Text.Json System.Text.Encodings.Web System.Threading.Channels System.Threading.Tasks.Extensions; do
            if ! find client/Unity/Assets/Packages -type f -name "${assembly}.dll" -print -quit | grep -q .; then
              echo "::error::NuGet restore did not produce ${assembly}.dll"
              exit 1
            fi
          done

      - name: Build Android AssetBundle
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: client/Unity
          targetPlatform: Android
          buildMethod: RagnarokContentPatchBuildEntryPoint.BuildAndroidPatch
          versioning: None
          allowDirtyBuild: true

      - name: Verify patch output
        shell: bash
        run: |
          set -euo pipefail
          test -s client/Unity/Build/ContentPatch/worldcontent
          test -s client/Unity/Build/ContentPatch/patch-sha256.txt
          echo "Bundle size:"
          ls -lh client/Unity/Build/ContentPatch/worldcontent
          echo "SHA-256:"
          cat client/Unity/Build/ContentPatch/patch-sha256.txt

      - name: Upload patch build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Private-Ragnarok-Android-Content-Patch
          path: |
            client/Unity/Build/ContentPatch/worldcontent
            client/Unity/Build/ContentPatch/patch-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish versioned content bundle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: content-v1
          name: Private Ragnarok Content Patches
          target_commitish: ${{ github.sha }}
          files: client/Unity/Build/ContentPatch/worldcontent
          overwrite_files: true
          make_latest: false

      - name: Enable the published patch in update manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          HASH="$(cat client/Unity/Build/ContentPatch/patch-sha256.txt)"
          BUNDLE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/content-v1/worldcontent"
          PATCH_VERSION="1.0.${GITHUB_RUN_NUMBER}"

          REMOTE_MANIFEST="$(gh api "repos/${GITHUB_REPOSITORY}/contents/update/update.json")"
          CONTENT_SHA="$(printf '%s' "$REMOTE_MANIFEST" | jq -r .sha)"
          printf '%s' "$REMOTE_MANIFEST" | jq -r .content | tr -d '\n' | base64 -d > update/update.json
          jq \
            --arg version "$PATCH_VERSION" \
            --arg url "$BUNDLE_URL" \
            --arg hash "$HASH" \
            '.patchEnabled = true
             | .patchVersion = $version
             | .patchBundleUrl = $url
             | .patchBundleName = "worldcontent"
             | .patchSha256 = $hash
             | .worldPrefab = "WorldRoot"' \
            update/update.json > update/update.json.tmp
          mv update/update.json.tmp update/update.json

          CONTENT_B64="$(base64 -w0 update/update.json)"
          gh api "repos/${GITHUB_REPOSITORY}/contents/update/update.json" \
            -X PUT \
            -f message="Publish remote content patch ${PATCH_VERSION}" \
            -f branch="main" \
            -f sha="$CONTENT_SHA" \
            -f content="$CONTENT_B64"
