name: Unity Personal License Activation File

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  request-activation:
    name: Request Unity activation file
    runs-on: ubuntu-latest
    steps:
      - name: Generate activation request
        id: activation
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 2022.3.62f1

      - name: Upload activation request
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Personal-Activation-Request
          path: ${{ steps.activation.outputs.filePath }}
          if-no-files-found: error
          retention-days: 7
