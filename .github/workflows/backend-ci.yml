name: Backend CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Restore and build API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore src/PrivateRagnarok.Api/PrivateRagnarok.Api.csproj
      - name: Build
        run: dotnet build src/PrivateRagnarok.Api/PrivateRagnarok.Api.csproj --configuration Release --no-restore
      - name: Build container image
        run: docker build --tag private-ragnarok-api:ci --file src/PrivateRagnarok.Api/Dockerfile .
