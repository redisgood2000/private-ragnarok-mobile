name: Generate Blender Chibi Character
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/blender/create_chibi_swordsman.py"
      - ".github/workflows/generate-blender-character.yml"

permissions:
  contents: write
  actions: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          blender --version

      - name: Generate native Blender and Unity FBX assets
        run: |
          mkdir -p build
          OUTPUT_DIR="$PWD/build" blender --background --factory-startup --python tools/blender/create_chibi_swordsman.py

      - name: Verify generated files
        run: |
          test -s build/Cute_Ragnarok_Inspired_Chibi_Swordsman.blend
          test -s build/Cute_Ragnarok_Inspired_Chibi_Swordsman.fbx
          ls -lh build/

      - name: Add FBX model to Unity remote resource package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p client/Unity/Assets/RemoteContent/Characters
          install -m 0644 build/Cute_Ragnarok_Inspired_Chibi_Swordsman.fbx \
            client/Unity/Assets/RemoteContent/Characters/Cute_Ragnarok_Inspired_Chibi_Swordsman.fbx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/Unity/Assets/RemoteContent/Characters/Cute_Ragnarok_Inspired_Chibi_Swordsman.fbx
          if ! git diff --cached --quiet; then
            git commit -m "Add chibi swordsman to remote character resources"
            pushed=false
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              echo "Push race on attempt $attempt; retrying after rebase."
              sleep 3
            done
            if [ "$pushed" != true ]; then
              echo "::error::Could not push the generated FBX after five rebase attempts."
              exit 1
            fi
          fi

      - name: Trigger Android resource package build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run unity-content-patch.yml --ref main

      - name: Upload character assets
        uses: actions/upload-artifact@v4
        with:
          name: Cute-Chibi-Swordsman-Blender-and-Unity
          path: |
            build/Cute_Ragnarok_Inspired_Chibi_Swordsman.blend
            build/Cute_Ragnarok_Inspired_Chibi_Swordsman.fbx
          if-no-files-found: error
          retention-days: 30
