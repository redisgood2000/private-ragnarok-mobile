name: Unity Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/unity-android.yml"
      - "client/Unity/**"

permissions:
  contents: write

jobs:
  build-android:
    name: Build, verify and publish Android update
    runs-on: ubuntu-latest
    steps:
      - name: Check Unity license secret
        shell: bash
        env:
          UNITY_LICENSE_SECRET: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -z "$UNITY_LICENSE_SECRET" ]; then
            echo "::error::Add the UNITY_LICENSE repository secret before running this workflow."
            exit 1
          fi

      - name: Validate Android signing secrets
        shell: bash
        env:
          KS_DATA: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KS_ALIAS: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          KS_ALIAS_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS }}
        run: |
          set -euo pipefail
          for name in KS_DATA KS_PASS KS_ALIAS KS_ALIAS_PASS; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required Android signing secret: ${name}"
              exit 1
            fi
          done

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET for NuGet restore
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore Unity NuGet dependencies
        run: |
          dotnet tool install --global NuGetForUnity.Cli --version 4.5.0
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          export PATH="$PATH:$HOME/.dotnet/tools"
          nugetforunity restore client/Unity

      - name: Verify restored Unity assemblies
        shell: bash
        run: |
          set -euo pipefail
          test -d client/Unity/Assets/Packages
          for assembly in Microsoft.AspNetCore.Connections.Abstractions Microsoft.Bcl.TimeProvider Microsoft.Bcl.AsyncInterfaces Microsoft.Extensions.Features Microsoft.Extensions.DependencyInjection Microsoft.Extensions.DependencyInjection.Abstractions Microsoft.Extensions.Logging Microsoft.Extensions.Logging.Abstractions Microsoft.Extensions.Options Microsoft.Extensions.Primitives System.Buffers System.Diagnostics.DiagnosticSource System.IO.Pipelines System.Memory System.Runtime.CompilerServices.Unsafe System.Text.Json System.Text.Encodings.Web System.Threading.Channels System.Threading.Tasks.Extensions; do
            if ! find client/Unity/Assets/Packages -type f -name "${assembly}.dll" -print -quit | grep -q .; then
              echo "::error::NuGet restore did not produce ${assembly}.dll"
              exit 1
            fi
          done

      - name: Write Unity build number
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p client/Unity/Assets/Editor
          printf '%s' "$GITHUB_RUN_NUMBER" > client/Unity/Assets/Editor/BuildNumber.txt
          echo "Unity application version: 0.1.$GITHUB_RUN_NUMBER"
          echo "Android version code: $GITHUB_RUN_NUMBER"

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: client/Unity
          targetPlatform: Android
          androidExportType: androidPackage
          androidTargetSdkVersion: 35
          buildMethod: RagnarokAndroidBuildEntryPoint.Build
          versioning: None
          allowDirtyBuild: true
          androidKeystoreName: privateragnarok-release.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      - name: Verify APK signature and output
        shell: bash
        run: |
          set -euo pipefail
          APK="client/Unity/Build/PrivateRagnarok.apk"
          test -s "$APK"
          ls -lh "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          set +e
          VERIFY_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1)"
          VERIFY_STATUS=$?
          set -e
          printf '%s\n' "$VERIFY_OUTPUT"

          # Some Unity/Android build metadata is intentionally outside the legacy
          # JAR (v1) manifest. apksigner reports these as warnings even though the
          # APK Signature Scheme v2 digest protects the complete APK contents.
          # Accept only when v1 and v2 both verify and exactly one SHA-256 signer
          # certificate is present. Any missing/failed signature check still fails.
          printf '%s\n' "$VERIFY_OUTPUT" | grep -Fq "Verified using v1 scheme (JAR signing): true"
          printf '%s\n' "$VERIFY_OUTPUT" | grep -Fq "Verified using v2 scheme (APK Signature Scheme v2): true"
          printf '%s\n' "$VERIFY_OUTPUT" | grep -Eq "^Number of signers: 1$"
          printf '%s\\n' "$VERIFY_OUTPUT" | grep -Eq "^V2 Signer: certificate SHA-256 digest: [[:xdigit:]]{64}$"
          printf '%s\\n' "$VERIFY_OUTPUT" | grep -Fq "CN=redisgood"
          if printf '%s\\n' "$VERIFY_OUTPUT" | grep -Fq "CN=Android Debug"; then
            echo "::error::APK is signed with the Android debug certificate, not the configured release key."
            exit 1
          fi

          if [ "$VERIFY_STATUS" -ne 0 ]; then
            WARNING_COUNT="$(printf '%s\n' "$VERIFY_OUTPUT" | grep -c '^WARNING: META-INF/' || true)"
            OTHER_WARNINGS="$(printf '%s\n' "$VERIFY_OUTPUT" | grep '^WARNING:' | grep -Ev '^WARNING: META-INF/(com/android/build/gradle/app-metadata\.properties|com\.android\.games\.engine\.build_fingerprint) not protected by signature\.' || true)"
            if [ "$WARNING_COUNT" -ne 2 ] || [ -n "$OTHER_WARNINGS" ]; then
              echo "::error::APK signature verification failed for reasons beyond the two known unsigned Unity metadata entries."
              exit 1
            fi
            echo "::notice::APK v1/v2 signatures verified. Ignoring only the two known unsigned metadata warnings; v2 covers the complete APK."
          fi

      # Always preserve a downloadable APK even if GitHub Releases has a
      # transient API outage. The release is a convenience, not the build output.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Private-Ragnarok-Android-APK
          path: client/Unity/Build/PrivateRagnarok.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish versioned GitHub release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Private Ragnarok v0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: client/Unity/Build/PrivateRagnarok.apk
