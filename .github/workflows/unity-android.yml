name: Unity Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Unity Android ARM64 APK
    runs-on: ubuntu-latest
    steps:
      - name: Check Unity license secret
        shell: bash
        env:
          UNITY_LICENSE_SECRET: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -z "$UNITY_LICENSE_SECRET" ]; then
            echo "::error::Add the UNITY_LICENSE repository secret before running this workflow."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      # Restore Unity's generated import database between runs. The cache key changes
      # when the Unity editor version or package/dependency manifests change.
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: client/Unity/Library
          key: ${{ runner.os }}-unity-library-${{ hashFiles('client/Unity/ProjectSettings/ProjectVersion.txt', 'client/Unity/Packages/manifest.json', 'client/Unity/Assets/packages.config') }}
          restore-keys: |
            ${{ runner.os }}-unity-library-

      # NuGetForUnity writes restored DLLs into Assets/Packages. Cache those too,
      # otherwise Unity cannot reuse the previous dependency import state.
      - name: Cache Unity NuGet packages
        uses: actions/cache@v4
        with:
          path: |
            client/Unity/Assets/Packages
            client/Unity/Assets/NuGet.config
            ~/.nuget/packages
          key: ${{ runner.os }}-unity-nuget-${{ hashFiles('client/Unity/Assets/packages.config') }}
          restore-keys: |
            ${{ runner.os }}-unity-nuget-

      - name: Set up .NET for NuGet restore
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore Unity NuGet dependencies
        run: |
          dotnet tool install --global NuGetForUnity.Cli --version 4.5.0
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          export PATH="$PATH:$HOME/.dotnet/tools"
          nugetforunity restore client/Unity

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: client/Unity
          targetPlatform: Android
          androidExportType: androidPackage
          androidTargetSdkVersion: 35
          buildMethod: PrivateRagnarok.Editor.AndroidBuildBootstrap.Build
          versioning: Semantic
          allowDirtyBuild: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Private-Ragnarok-Android-APK
          path: client/Unity/Build/PrivateRagnarok.apk
          if-no-files-found: error
          retention-days: 14
