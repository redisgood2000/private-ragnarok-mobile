name: Unity Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Unity Android ARM64 APK
    runs-on: ubuntu-latest
    steps:
      - name: Check Unity license secret
        shell: bash
        env:
          UNITY_LICENSE_SECRET: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -z "$UNITY_LICENSE_SECRET" ]; then
            echo "::error::Add the UNITY_LICENSE repository secret before running this workflow."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Unity NuGet dependencies
        run: |
          dotnet tool install --global NuGetForUnity.Cli --version 4.5.0
          dotnet nugetforunity restore client/Unity

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: client/Unity
          targetPlatform: Android
          buildMethod: PrivateRagnarok.Editor.AndroidBuildBootstrap.Build
          versioning: Semantic
          androidAppBundle: false

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Private-Ragnarok-Android-APK
          path: client/Unity/Build/PrivateRagnarok.apk
          if-no-files-found: error
          retention-days: 14
