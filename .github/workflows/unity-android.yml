name: Unity Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Unity Android ARM64 APK
    runs-on: ubuntu-latest
    steps:
      - name: Check Unity license secret
        shell: bash
        env:
          UNITY_LICENSE_SECRET: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -z "$UNITY_LICENSE_SECRET" ]; then
            echo "::error::Add the UNITY_LICENSE repository secret before running this workflow."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      # Cache only the global NuGet download cache. Unity's Assets/Packages
      # must be recreated from packages.config on every clean checkout.
      - name: Cache Unity NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-unity-nuget-${{ hashFiles('client/Unity/Assets/packages.config') }}
          restore-keys: |
            ${{ runner.os }}-unity-nuget-

      - name: Set up .NET for NuGet restore
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore Unity NuGet dependencies
        run: |
          dotnet tool install --global NuGetForUnity.Cli --version 4.5.0
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          export PATH="$PATH:$HOME/.dotnet/tools"
          nugetforunity restore client/Unity

      - name: Verify restored Unity assemblies
        shell: bash
        run: |
          set -euo pipefail
          test -d client/Unity/Assets/Packages
          find client/Unity/Assets/Packages -type f -name '*.dll' -print | sort
          for assembly in \
            Microsoft.AspNetCore.Connections.Abstractions \
            Microsoft.Bcl.TimeProvider \
            Microsoft.Bcl.AsyncInterfaces \
            Microsoft.Extensions.Features \
            Microsoft.Extensions.DependencyInjection \
            Microsoft.Extensions.DependencyInjection.Abstractions \
            Microsoft.Extensions.Logging \
            Microsoft.Extensions.Logging.Abstractions \
            Microsoft.Extensions.Options \
            Microsoft.Extensions.Primitives \
            System.Buffers \
            System.Diagnostics.DiagnosticSource \
            System.IO.Pipelines \
            System.Memory \
            System.Text.Json \
            System.Text.Encodings.Web \
            System.Threading.Channels \
            System.Threading.Tasks.Extensions; do
            if ! find client/Unity/Assets/Packages -type f -name "${assembly}.dll" -print -quit | grep -q .; then
              echo "::error::NuGet restore did not produce ${assembly}.dll"
              exit 1
            fi
          done

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: client/Unity
          targetPlatform: Android
          androidExportType: androidPackage
          androidTargetSdkVersion: 35
          buildMethod: RagnarokAndroidBuildEntryPoint.Build
          versioning: Semantic
          allowDirtyBuild: true

      - name: Save Unity NuGet cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-unity-nuget-${{ hashFiles('client/Unity/Assets/packages.config') }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Private-Ragnarok-Android-APK
          path: client/Unity/Build/PrivateRagnarok.apk
          if-no-files-found: error
          retention-days: 14
